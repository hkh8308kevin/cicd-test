name: Feather Flow Sysinfo
on: [push]

jobs:
  system-info:
    runs-on: windows-latest
    steps:
      - name: Get System Info (Bash)
        shell: bash
        run: |
          echo "::group::Bash System Info"
          uname -a
          echo "::endgroup::"
      
      - name: Get System Info (PowerShell)
        shell: pwsh
        run: |
          echo "::group::PowerShell System Info"
          Get-ComputerInfo
          echo "::endgroup::"
      
      - name: Get System Info (Python)
        shell: python
        run: |
          echo "::group::Python System Info"
          python -c "import sys; print(sys.version)"
          echo "::endgroup::"
      
      - name: Get System Info (Node.js)
        shell: node
        run: |
          echo "::group::Node.js System Info"
          node -e "console.log(process.version)"
          echo "::endgroup::"
